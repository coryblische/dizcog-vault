services:
  - type: web
    name: dizcog-vault
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: LEDGER_PASSWORD
        sync: false
      - key: LEDGER_AUTH_SECRET
        generateValue: true
